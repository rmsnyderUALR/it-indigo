<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="Currency Value History">
    <meta name="keywords" content="HTML, CSS,JavaScript, AJAX, jQuery">
    <meta name="author" content="Ryan Snyder">
    <title>Currency Value History</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <form id="myform" onsubmit="return false">
        <div class="formcontainer">
            <h2>Currency Value History</h2>

            <label>Base Currency: </label>
            <select name="selBaseCurrency" id="baseCurrency"                
                    data-rule-required="true" data-msg-required="Base Currency is Required">
                <option value="">Select a Base Currency...</option>
                <option value="USD">US Dollar</option>
                <option value="EUR">Euro</option>
                <option value="JPY">Japanese Yen</option>
                <option value="GBP">British Pound Sterling</option>
                <option value="CNY">Chinese Renminbi</option>
            </select>
            <label for="selBaseCurrency" class="error"></label><br>

            <label>Convert to Currency: </label>
            <select name="selConvertCurrency" id="convertCurrency"                
                    data-rule-required="true" data-msg-required="Convert to Currency is Required">
                <option value="">Select a Base Currency...</option>
                <option value="USD">US Dollar</option>
                <option value="EUR">Euro</option>
                <option value="JPY">Japanese Yen</option>
                <option value="GBP">British Pound Sterling</option>
                <option value="CNY">Chinese Renminbi</option>
            </select>
            <label for="selConvertCurrency" class="error"></label><br>
            
            <label for="FromDate" class="formlabel">From Date:</label>
            <input type="date" name="FromDate" id="FromDate" 
                data-rule-required="true" data-msg-required="From Date is Required">
            <label id="FromDateError" for="FromDate" class="error"></label><br>

            <label for="ToDate" class="formlabel">To Date:</label>
            <input type="date" name="ToDate" id="ToDate" 
			     data-rule-required="true" data-msg-required="To Date is Required">
	        <label id="ToDateError" for="ToDate" class="error"></label><br><br>

            <input type="submit" value="Show Results" id="showResults" name="showResults" onclick="convCurrency();">
            <input type="submit" formnovalidate value="Clear" id="Clear" name="Clear" onclick="ClearForm();">
            <hr><br>

            <label for="company" class="formlabel">Company: </label>
            <span id="company"></span><br>
            <label for="address" class="formlabel">Address: </label>
            <span id="address"></span><br>
            <label for="employees" class="formlabel">Employees: </label>
            <span id="employees"></span><br>
            <label for="description" class="formlabel">Description: </label>
            <span id="description"></span><br>
            <label for="url" class="formlabel">URL: </label>
            <a id="url"></a><br>
            <hr>

            <div class="clearfix">
                <div class="img-container">
                    <span id="StockValueTable"></span>
                </div>
                <div class="img-container">
                    <span id="StockVolumeTable"></span>
                </div>
            </div>
            <hr>
            
            <div class="clearfix">
                <div class="img-container">
                    <canvas id="chartjs-0" width="400" height="400"></canvas>
                </div>
                <div class="img-container">
                    <canvas id="chartjs-1" width="400" height="400"></canvas>
                </div>
            </div>
        </div>
    </form>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/jquery.validation/1.16.0/jquery.validate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/jquery.validation/1.16.0/additional-methods.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.3/Chart.min.js"></script>
    <script src="scripts/script.js"></script>
</body>
</html>
